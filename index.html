<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World Folder</title>
<style>
:root{
  --bg:#cdbdff; --card:#ffffff; --ink:#14102b; --muted:#4a4470;
  --pink:#ff6fb1; --yellow:#ffe14d; --blue:#4d7cff; --mint:#5ee6b0;
  --b:3px solid var(--ink); --sh:6px 6px 0 var(--ink); color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#1b1240; --card:#2a1d5c; --ink:#f4f0ff; --muted:#bdb2ee;
    --pink:#ff6fb1; --yellow:#ffe14d; --blue:#6f95ff; --mint:#5ee6b0;
    --b:3px solid var(--ink); --sh:6px 6px 0 #000; color-scheme:dark;
  }
}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;font-weight:500;line-height:1.55;
  background-color:var(--bg);
  background-image:radial-gradient(var(--ink) 1.2px,transparent 1.4px);background-size:26px 26px;background-position:0 0;min-height:100vh}
.wrap{max-width:1000px;margin:0 auto;padding:0 18px}

/* hero */
.hero{padding:40px 0 8px;position:relative}
.hero h1{margin:0;font-family:"Arial Black","Helvetica Neue",Impact,sans-serif;font-weight:900;font-size:clamp(3rem,15vw,7rem);
  line-height:.88;letter-spacing:-.04em;color:var(--yellow);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;
  text-shadow:6px 6px 0 var(--ink)}
.hero h1 span{display:block;color:var(--pink)}
.sticker{display:inline-block;margin-top:20px;background:var(--mint);color:#14102b;border:var(--b);border-radius:999px;padding:8px 18px;
  font-weight:800;box-shadow:4px 4px 0 var(--ink);transform:rotate(-2deg)}

/* tabs */
nav{display:flex;gap:10px;margin:30px 0 26px;flex-wrap:wrap}
nav button{display:flex;align-items:center;gap:8px;background:var(--card);color:var(--ink);border:var(--b);border-radius:12px;
  padding:10px 16px;font:800 1rem "Trebuchet MS",sans-serif;cursor:pointer;box-shadow:4px 4px 0 var(--ink);transition:transform .1s,box-shadow .1s}
nav button:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
nav button:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
nav button[aria-selected="true"]{background:var(--pink);color:#14102b}
nav .n{background:var(--ink);color:var(--bg);border-radius:8px;font-size:.78rem;padding:0 7px;min-width:22px;text-align:center}
button:focus-visible,a:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
section{display:none;padding-bottom:70px}
section.active{display:block}

.note{background:var(--card);border:var(--b);border-radius:14px;box-shadow:var(--sh);padding:26px;text-align:center;font-weight:700}

/* images */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:20px;padding-right:6px}
.grid .pc{padding:0;background:var(--card);border:var(--b);border-radius:14px;box-shadow:var(--sh);overflow:hidden;cursor:zoom-in;
  transition:transform .12s,box-shadow .12s}
.grid .pc:nth-child(4n+1){background:var(--yellow)}.grid .pc:nth-child(4n+2){background:var(--pink)}
.grid .pc:nth-child(4n+3){background:var(--mint)}.grid .pc:nth-child(4n){background:var(--blue)}
.grid .pc:hover{transform:translate(-3px,-3px);box-shadow:10px 10px 0 var(--ink)}
.grid img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--card)}

/* videos */
.videos{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:24px;padding-right:6px}
.vcard{background:var(--card);border:var(--b);border-radius:16px;box-shadow:var(--sh);padding:10px}
.vcard iframe{width:100%;aspect-ratio:16/9;border:var(--b);border-radius:10px;background:#000;display:block}
.vcard p{margin:10px 4px 2px;font-weight:700;word-break:break-all}

/* files */
.files{list-style:none;margin:0;padding:0 6px 0 0;display:grid;gap:16px}
.files li{display:flex;align-items:center;gap:14px;background:var(--card);border:var(--b);border-radius:14px;box-shadow:var(--sh);padding:12px}
.ext{flex:none;width:52px;height:52px;border:var(--b);border-radius:10px;display:grid;place-items:center;background:var(--blue);color:#fff;
  font-weight:900;font-size:.75rem;text-transform:uppercase;text-shadow:1px 1px 0 #14102b}
.files .nm{flex:1;min-width:0;word-break:break-all;font-weight:800}
.files small{display:block;color:var(--muted);font-weight:600}
.dl{flex:none;background:var(--yellow);color:#14102b;border:var(--b);border-radius:10px;text-decoration:none;font-weight:800;padding:8px 14px;
  box-shadow:3px 3px 0 var(--ink);transition:transform .1s,box-shadow .1s}
.dl:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}

/* upload */
.drop{background:var(--card);border:4px dashed var(--ink);border-radius:20px;box-shadow:var(--sh);padding:44px 18px;text-align:center;margin-right:6px;
  transition:background .15s,transform .15s}
.drop.over{background:var(--yellow);transform:rotate(-1deg) scale(1.02)}
.drop .big{font-size:3rem;line-height:1}
.drop h2{margin:6px 0 4px;font-family:"Arial Black",Impact,sans-serif;font-size:1.8rem;letter-spacing:-.02em}
.drop p{margin:0 0 18px;color:var(--muted);font-weight:700}
.drop.over p{color:#14102b}
.drop button{background:var(--pink);color:#14102b;border:var(--b);border-radius:14px;padding:14px 28px;font:900 1.05rem "Trebuchet MS",sans-serif;
  cursor:pointer;box-shadow:5px 5px 0 var(--ink);transition:transform .1s,box-shadow .1s}
.drop button:active{transform:translate(4px,4px);box-shadow:1px 1px 0 var(--ink)}
#log{list-style:none;padding:0 6px 0 0;margin:22px 0 0;display:grid;gap:12px}
#log li{background:var(--card);border:var(--b);border-radius:12px;padding:10px 14px;word-break:break-all;font-weight:700}
#log b.ok{color:#0a9d63} #log b.err{color:#e5303c}
.bar{height:12px;border:2px solid var(--ink);border-radius:8px;margin-top:8px;overflow:hidden;background:var(--card)}
.bar i{display:block;height:100%;width:35%;background:var(--pink);animation:slide .8s ease-in-out infinite alternate}
@keyframes slide{to{margin-left:65%}}

#lightbox{position:fixed;inset:0;background:rgba(20,16,43,.94);display:none;align-items:center;justify-content:center;padding:16px;z-index:10;cursor:zoom-out}
#lightbox.open{display:flex}
#lightbox img{max-width:100%;max-height:100%;border:var(--b);border-color:#fff;border-radius:10px}

.pc .open{display:block;width:100%;padding:0;border:0;background:none;cursor:zoom-in}
.mini{position:absolute;right:8px;bottom:8px;background:var(--yellow);color:#14102b;border:2px solid var(--ink);border-radius:8px;
  padding:3px 10px;font-size:.8rem;font-weight:800;text-decoration:none;box-shadow:2px 2px 0 var(--ink)}
.grid .pc{position:relative}
.vcard .dl{display:inline-block;margin:8px 4px 4px}
#lightbox{flex-direction:column;gap:16px}
#lightbox img{max-height:calc(100% - 70px)}
#lbdl{cursor:pointer}
#nm{display:block;width:100%;max-width:340px;margin:0 auto 16px;padding:12px 14px;font:700 1rem "Trebuchet MS",sans-serif;
  color:var(--ink);background:var(--card);border:var(--b);border-radius:12px}
#nm::placeholder{color:var(--muted)}
@media (max-width:560px){.grid{grid-template-columns:repeat(2,1fr);gap:14px}.files li{flex-wrap:wrap}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <h1>World<span>Folder</span></h1>
    <div class="sticker">Everyone can upload. Everyone can see.</div>
  </header>

  <main>
    <nav role="tablist">
      <button role="tab" aria-selected="true" data-tab="images">Images <span class="n" id="n-images">0</span></button>
      <button role="tab" aria-selected="false" data-tab="videos">Videos <span class="n" id="n-videos">0</span></button>
      <button role="tab" aria-selected="false" data-tab="files">Files <span class="n" id="n-files">0</span></button>
      <button role="tab" aria-selected="false" data-tab="upload">Upload</button>
    </nav>
    <section id="images" class="active"></section>
    <section id="videos"></section>
    <section id="files"></section>
    <section id="upload">
      <div class="drop" id="drop">
        <div class="big" aria-hidden="true">&#128230;</div>
        <h2>Add to the folder</h2>
        <p>Drag files here or choose them. Up to 20 MB each.</p>
        <input id="nm" type="text" maxlength="80" placeholder="File name (optional)" aria-label="File name (optional)">
        <input id="picker" type="file" multiple hidden>
        <button id="pick">Choose files</button>
      </div>
      <ul id="log"></ul>
    </section>
  </main>
</div>
<div id="lightbox"><img alt=""><a id="lbdl" class="dl" target="_blank" rel="noopener">Download</a></div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyBhEhO9lF0ceNmAyWQLcwDUll7bOp7ea6ZA4sLiOYaYOk3DL8YJWSSc0oIZkh3ND20TQ/exec";
const MAX_MB = 20;
const $ = (s) => document.querySelector(s);

function note(el, text){ el.innerHTML = ""; const p = document.createElement("p"); p.className = "note"; p.textContent = text; el.appendChild(p); }
function size(n){ return n > 1048576 ? (n/1048576).toFixed(1)+" MB" : Math.max(1,Math.round(n/1024))+" KB"; }
function dlUrl(id){ return "https://drive.google.com/uc?export=download&id="+id; }
async function saveFile(f, a){
  const label = a.textContent; a.textContent = "Downloading..."; a.style.pointerEvents = "none";
  try {
    const out = await (await fetch(SCRIPT_URL + "?id=" + encodeURIComponent(f.id))).json();
    if(!out.data) throw new Error(out.error || "no data");
    const bin = atob(out.data), bytes = new Uint8Array(bin.length);
    for(let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([bytes], { type: out.type || "application/octet-stream" }));
    const t = document.createElement("a"); t.href = url; t.download = f.name; document.body.appendChild(t); t.click(); t.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  } catch(e){ window.open(dlUrl(f.id), "_blank"); }
  a.textContent = label; a.style.pointerEvents = "";
}
function hookDl(a, f){ a.href = dlUrl(f.id); a.removeAttribute("target"); a.onclick = e => { e.preventDefault(); e.stopPropagation(); saveFile(f, a); }; }
function ext(name){ const m = /\.([a-z0-9]{1,5})$/i.exec(name); return m ? m[1] : "file"; }

async function load(){
  let list;
  try { list = await (await fetch(SCRIPT_URL)).json(); }
  catch(e){ ["images","videos","files"].forEach(id => note($("#"+id), "Could not load files. Check the Apps Script URL and that access is set to Anyone.")); return; }

  const imgs = list.filter(f => f.type.startsWith("image/"));
  const vids = list.filter(f => f.type.startsWith("video/"));
  const rest = list.filter(f => !f.type.startsWith("image/") && !f.type.startsWith("video/"));
  $("#n-images").textContent = imgs.length; $("#n-videos").textContent = vids.length; $("#n-files").textContent = rest.length;

  const gi = $("#images"); gi.innerHTML = "";
  if(!imgs.length) note(gi, "No images yet. Open the Upload tab to add the first one.");
  else { const g = document.createElement("div"); g.className = "grid";
    imgs.forEach(f => { const w = document.createElement("div"); w.className = "pc";
      const b = document.createElement("button"); b.className = "open"; b.setAttribute("aria-label","Open "+f.name);
      const i = document.createElement("img"); i.src = "https://drive.google.com/thumbnail?id="+f.id+"&sz=w500"; i.alt = f.name; i.loading = "lazy";
      b.onclick = () => { $("#lightbox img").src = "https://drive.google.com/thumbnail?id="+f.id+"&sz=w1600";
        hookDl($("#lbdl"), f); $("#lightbox").classList.add("open"); };
      const a = document.createElement("a"); a.className = "mini"; a.textContent = "Download"; hookDl(a, f);
      a.target = "_blank"; a.rel = "noopener"; a.setAttribute("aria-label","Download "+f.name);
      b.appendChild(i); w.append(b, a); g.appendChild(w); }); gi.appendChild(g); }

  const gv = $("#videos"); gv.innerHTML = "";
  if(!vids.length) note(gv, "No videos yet. Open the Upload tab to add one.");
  else { const g = document.createElement("div"); g.className = "videos";
    vids.forEach(f => { const c = document.createElement("div"); c.className = "vcard"; const fr = document.createElement("iframe");
      fr.src = "https://drive.google.com/file/d/"+f.id+"/preview"; fr.allow = "autoplay"; fr.allowFullscreen = true; fr.loading = "lazy"; fr.title = f.name;
      const p = document.createElement("p"); p.textContent = f.name;
      const a = document.createElement("a"); a.className = "dl"; a.textContent = "Download"; hookDl(a, f);
      c.append(fr, p, a); g.appendChild(c); }); gv.appendChild(g); }

  const gf = $("#files"); gf.innerHTML = "";
  if(!rest.length) note(gf, "No files yet. Open the Upload tab to add one.");
  else { const ul = document.createElement("ul"); ul.className = "files";
    rest.forEach(f => { const li = document.createElement("li");
      const e = document.createElement("div"); e.className = "ext"; e.textContent = ext(f.name).slice(0,4);
      const s = document.createElement("div"); s.className = "nm"; s.textContent = f.name;
      const sm = document.createElement("small"); sm.textContent = size(f.size); s.appendChild(sm);
      const a = document.createElement("a"); a.className = "dl"; a.textContent = "Download";
      hookDl(a, f);
      li.append(e, s, a); ul.appendChild(li); }); gf.appendChild(ul); }
}

function toBase64(file){
  return new Promise((ok, fail) => { const r = new FileReader();
    r.onload = () => ok(r.result.split(",")[1]); r.onerror = () => fail(r.error); r.readAsDataURL(file); });
}

async function upload(files){
  const log = $("#log");
  const custom = $("#nm").value.trim(); let k = 0;
  for(const file of files){
    k++;
    const m = /\.[a-z0-9]{1,5}$/i.exec(file.name); const e = m ? m[0] : "";
    let finalName = file.name;
    if(custom){ finalName = custom + (files.length > 1 ? " " + k : ""); if(e && !finalName.toLowerCase().endsWith(e.toLowerCase())) finalName += e; }
    const li = document.createElement("li"); li.textContent = finalName + " — ";
    const st = document.createElement("b"); li.appendChild(st); log.prepend(li);
    if(file.size > MAX_MB*1048576){ st.className = "err"; st.textContent = "Too large (max "+MAX_MB+" MB)."; continue; }
    st.textContent = "Uploading..."; const bar = document.createElement("div"); bar.className = "bar"; bar.innerHTML = "<i></i>"; li.appendChild(bar);
    try {
      const data = await toBase64(file);
      const res = await fetch(SCRIPT_URL, { method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
        body: JSON.stringify({ name:finalName, type:file.type || "application/octet-stream", data }) });
      const out = await res.json();
      st.className = out.ok ? "ok" : "err"; st.textContent = out.ok ? "Uploaded" : "Failed: " + (out.error || "unknown error");
    } catch(e){ st.className = "err"; st.textContent = "Failed. Check your connection and try again."; }
    bar.remove();
  }
  $("#nm").value = "";
  load();
}

$("#pick").onclick = () => $("#picker").click();
$("#picker").onchange = (e) => { upload([...e.target.files]); e.target.value = ""; };
const drop = $("#drop");
["dragenter","dragover"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave","drop"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => upload([...e.dataTransfer.files]));
document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  document.querySelectorAll("nav button").forEach(x => x.setAttribute("aria-selected", x === b));
  document.querySelectorAll("section").forEach(s => s.classList.toggle("active", s.id === b.dataset.tab));
});
$("#lightbox").onclick = () => $("#lightbox").classList.remove("open");
load();
</script>
</body>
</html>
